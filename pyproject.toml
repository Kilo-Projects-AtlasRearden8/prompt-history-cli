[project]
name = "prompt-history"
version = "0.1.0"
description = "Local-first CLI to save, tag, diff, search, and export prompt versions."
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
prompt-history = "prompt_history.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prompt_history"]
